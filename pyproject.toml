[project]
name = "main-python-algo"
version = "0.1.0"
description = "Фреймворк бэктестинга и валидации торговых стратегий (WFA, Монте-Карло, DSR)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "PySide6>=6.6",
    "finplot>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py312"
exclude = [".venv", "__pycache__", "reports", "data"]
