[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "main-python-algo"
version = "0.1.0"
description = "Фреймворк бэктестинга и валидации торговых стратегий (WFA, Монте-Карло, DSR)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "PySide6>=6.6",
    "finplot>=1.9",
]

[project.optional-dependencies]
# Numba-ускорение сигнального движка (backtester.fast_engine). Опционально:
# ядро пакета работает без него, numba нужен только для run_fast_backtest.
fast = [
    "numba>=0.60",
]
# Машинное обучение (пакет ml/, вкладка «🧠 Машинное обучение»). Опционально:
# приложение запускается без этих пакетов, ML-вкладка тогда показывает подсказку
# по установке. Только классические модели — легко на CPU и по памяти.
ml = [
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "joblib>=1.3",
]
# Live-торговля на криптобиржах (пакет live/, окно «Торговля»). Опционально:
# приложение и тестер запускаются без ccxt, окно торговли тогда показывает
# подсказку по установке. ccxt даёт единый API к Binance (CEX) и Lighter (DEX).
live = [
    "ccxt>=4.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "numba>=0.60",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "ccxt>=4.0",
]

# Запуск десктопного приложения: `algo-desktop` (после `pip install -e .`).
# gui-scripts (а не scripts) — на Windows не открывает лишнее консольное окно.
[project.gui-scripts]
algo-desktop = "desktop_app:main"

# Плоская раскладка (пакеты + одиночные модули в корне) — авто-discovery
# setuptools на ней спотыкается, поэтому состав дистрибутива задаём явно.
# tests/ и dev-скрипты (main/sanity_check/gui_smoke_test) в пакет не входят:
# тесты импортируют их из дерева исходников через pytest pythonpath = ["."].
[tool.setuptools]
packages = ["backtester", "gui", "live", "ml", "ml.features", "strategies"]
py-modules = ["desktop_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py312"
exclude = [".venv", "__pycache__", "reports", "data"]

[tool.ruff.lint.per-file-ignores]
# chart_widget намеренно импортирует finplot/pyqtgraph ПОСЛЕ подмены locale и
# PYQTGRAPH_QT_LIB (finplot >= 1.9.4 иначе вызывает os._exit(1) на ru/by-локали).
"gui/chart_widget.py" = ["E402"]
